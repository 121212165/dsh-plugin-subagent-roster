# GENERATED FILE - do not edit by hand.
#
# Source of truth: lib/roster.js. Regenerate with `node scripts/gen-patch.mjs`;
# `npm test` fails when this file is stale.
#
# One row per role: a tool-subagent instance that pins, for its children,
#   persona      - the child persona-prefix section (identity and output contract)
#   toolFilter   - the exact tools that child may call; bulk units get none, and no
#                  filter ever grants a subagent tool, so a role child stays a leaf
#   agentOptions - the model tier that role runs on
#   maxDepth 1   - one level deep: the child may exist, and cannot delegate further
#
# Every row is addressed by id, so a user profile can override any of them
# without touching this package. Model ids and token ceilings resolve from the
# environment at load time, so one composition serves a bench route and a
# production route unchanged.

- insert:
    # ── Bulk line: one item per call, blind children, machine-checkable output ──
    # batch-worker / exact - tier batch, 0 tools
    - id: roster-batch-exact
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: 'subagent_batch_exact'
        backgroundMode: one-shot
        maxDepth: 1
        persona: |-
          You are a bulk work unit. You receive exactly ONE item and ONE output contract.
          Do not look for more items, do not iterate over lists, do not ask for the rest of a batch:
          the caller launches many of you in parallel, one per item.
          Emit the contracted output and nothing else - no preamble, no explanation, no markdown fence
          unless the contract is JSON, in which case emit exactly one JSON value.
          If the item cannot satisfy the contract, emit the contract's failure value instead of inventing data.
          Never delegate. You have no tools and no subagents.
        toolFilter:
          allow: []
        agentOptions:
          provider: !!js "process.env.ROSTER_PROVIDER ?? 'deepseek-official'"
          model: !!js "process.env.ROSTER_BATCH_MODEL ?? \"deepseek-flash\""
          maxTokens: !!js "Number(process.env.ROSTER_BATCH_MAX_TOKENS ?? 8192)"

